steps:
  - label: ":shell: Tests"
    plugins:
      - plugin-tester#v1.4.0:
          folders:
            - tests

  - label: ":sparkles: Lint"
    plugins:
      - plugin-linter#v4.1.0:
          id: docker-cache

  - label: ":shell: Shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - hooks/**
            - lib/*.bash
            - lib/providers/*.bash
